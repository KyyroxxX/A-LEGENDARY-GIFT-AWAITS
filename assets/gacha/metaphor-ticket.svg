  <circle cx="32" cy="20" r="3.2" fill="#1a0608"/>
  <circle cx="32" cy="44" r="3.2" fill="#1a0608"/>
  <path d="M32 23.5v17" stroke="#ffb0bc" stroke-width="1.4" stroke-dasharray="2.2 2.4" opacity=".7"/>
  <!-- Seal -->
  <circle cx="22" cy="32" r="7" fill="#6a0d18" stroke="#ffd0d6" stroke-width="1.2"/>
  <text x="22" y="35.5" text-anchor="middle" font-size="9" font-family="Georgia, serif" fill="#ffe8ec" font-weight="700">M</text>
  <path d="M38 26h12M38 32h12M38 38h8" stroke="#ffc0c8" stroke-width="1.5" stroke-linecap="round" opacity=".85"/>
