<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mt-rim" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd0d6"/>
      <stop offset=".4" stop-color="#e84a5f"/>
      <stop offset="1" stop-color="#6a0d18"/>
    </linearGradient>
    <linearGradient id="mt-body" x1="14" y1="12" x2="50" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff5a6e"/>
      <stop offset=".45" stop-color="#c41e3a"/>
      <stop offset="1" stop-color="#4a0810"/>
    </linearGradient>
    <filter id="mt-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Ticket body -->
  <path d="M10 18h44a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V22a4 4 0 0 1 4-4z"
